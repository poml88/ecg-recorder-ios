<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

{%- seo -%}

<meta name="apple-itunes-app" content="app-id=1541497051">

{%- assign langs = site.data.languages -%}
{%- for l in langs -%}
<link rel="alternate" hreflang="{{ l.hreflang }}" href="{{ site.url }}{{ site.baseurl }}{{ l.path }}/" />
{%- endfor -%}
<link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ site.baseurl }}/" />
