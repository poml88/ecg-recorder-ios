<section class="screenshots-section" aria-labelledby="screenshots-heading">
  <div class="screenshots-head">
    <h2 id="screenshots-heading">{{ page.screenshots_string | default: site.screenshots_string }}</h2>
    <p>{{ page.screenshots_intro | default: "Two key moments of the app: the main recording screen and the live ECG chart." }}</p>
  </div>

  <div class="sshot-grid">
  <figure class="sshot">
    <a href="{{ '/assets/img/iphone-01@2x.png' | relative_url }}" target="_blank" rel="noopener">
      <img src="{{ '/assets/img/iphone-01.png' | relative_url }}" alt="ECG REcorder home screen" loading="lazy">
    </a>
    <figcaption>Main screen</figcaption>
  </figure>

  <figure class="sshot">
    <a href="{{ '/assets/img/iphone-02@2x.png' | relative_url }}" target="_blank" rel="noopener">
      <img src="{{ '/assets/img/iphone-02.png' | relative_url }}" alt="ECG Recorder chart" loading="lazy">
    </a>
    <figcaption>Live chart</figcaption>
  </figure>
  </div>
</section>
