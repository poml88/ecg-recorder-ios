
<style>
/* Responsive two-section gallery (iPhone + Watch) */
.gallery {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  margin-top: 8px;
}

/* Make two columns on wider screens */
@media (min-width: 880px) {
  .gallery { grid-template-columns: 1fr 340px; align-items: start; }
}

.section {
  background: transparent;
}
.section h2 {
  font-size: 1.05rem;
  margin: 0 0 8px 0;
  font-weight: 600;
}

/* Grid for device screenshots */
.sshot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  align-items: start;
}

/* Slightly different sizing for phone vs watch */
.phone .sshot img { width: 100%; max-width: 320px; border-radius: 20px; display:block; }
.watch .sshot img { width: 100%; max-width: 180px; border-radius: 20px; display:block; }

/* common figure styling */
.sshot { text-align: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
.sshot a { display: inline-block; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.12); border-radius: 20px; }
.sshot figcaption { margin-top: 6px; font-size: 0.9rem; color: #333; }
@media (prefers-color-scheme: dark) {
  .sshot figcaption { color: #ccc; }
}
</style>
