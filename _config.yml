
# Site settings
title: "ECG Recorder iOS"
subtitle: "Record, export, and analyze single-lead ECGs on iPhone and iPad."
description: "ECG Recorder for iOS and iPadOS — capture single-lead ECGs, annotate events, and export data. Open-source landing page hosted on GitHub Pages."
url: "https://poml88.github.io"
baseurl: "/ecg-recorder-ios"

lang: "en"
app_icon: "/assets/img/app-icon.png"

# i18n data
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      image: "/assets/img/og-card.png"


# SEO plugin (allowed on GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude (optional)
exclude:
  - README.md
  - node_modules
  - vendor

# Paths for legal docs (German authoritative versions)
de_impressum_path: "/de/impressum.html"
de_privacy_path: "/de/datenschutzerklaerung.html"
